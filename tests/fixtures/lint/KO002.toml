# KO002: sandbox_permissions is ignored (silent under codex sandbox, exec warns).
# {R} is a disposable root; tests and runs replace it.
sandbox_permissions = ["disk-full-read-access"]
default_permissions = "p"

[permissions.p]
extends = ":read-only"

[permissions.p.filesystem]
"{R}/protected" = "deny"
"{R}/work" = "write"
